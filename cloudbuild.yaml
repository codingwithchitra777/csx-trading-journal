steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/csx-trading-journal:$COMMIT_SHA', '.']
  
  # Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/csx-trading-journal:$COMMIT_SHA']
  
  # Deploy container image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'csx-trading-journal'
      - '--image'
      - 'gcr.io/$PROJECT_ID/csx-trading-journal:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--max-instances'
      - '1'
      - '--min-instances'
      - '0'
      - '--timeout'
      - '300s'
      - '--set-secrets'
      - 'TELEGRAM_BOT_TOKEN=telegram-bot-token:latest,FIREBASE_CREDENTIALS=firebase-service-account:latest'
      - '--set-env-vars'
      - 'FIREBASE_PROJECT_ID=codingwithchitra-3b07d'

images:
  - 'gcr.io/$PROJECT_ID/csx-trading-journal:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY
